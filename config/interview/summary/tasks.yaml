analyze_performance:
  description: >
    Phân tích kết quả buổi phỏng vấn dưới đây:

    === THỐNG KÊ TỔNG QUAN ===
    - Tổng số câu hỏi : {total_questions}
    - Đã trả lời      : {answered_count} | Bỏ qua: {skipped_count}
    - Điểm trung bình : {total_score}/10
    - Điểm theo loại  :
    {category_stats_text}

    === CHI TIẾT CÁC CÂU HỎI ===
    {qa_block}

    === JD (VỊ TRÍ ỨNG TUYỂN) ===
    {jd_text}

    === CV (ỨNG VIÊN) ===
    {cv_text}

    Hãy phân tích:
    1. Xu hướng hiệu suất — ứng viên mạnh nhất ở loại câu hỏi nào, yếu ở đâu
    2. Các pattern nổi bật (VD: tốt câu technical nhưng yếu câu behavioral)
    3. Sự phù hợp giữa kinh nghiệm CV với câu trả lời thực tế
    4. Mức độ phù hợp với yêu cầu JD
    5. Top điểm mạnh và điểm yếu cụ thể nhất

    Trả về phân tích chi tiết bằng tiếng Việt.
  expected_output: >
    Phân tích hiệu suất phỏng vấn toàn diện gồm: xu hướng điểm số,
    điểm mạnh/yếu theo loại câu hỏi, mức độ phù hợp với JD và CV.
  agent: performance_analyst

generate_report:
  description: >
    Dựa trên phân tích từ bước trước và dữ liệu tổng quan:
    - Điểm trung bình    : {total_score}/10
    - Thống kê theo loại : {category_stats_json}

    Hãy tạo báo cáo tổng kết và đề xuất tuyển dụng.

    Thang xếp loại:
    - 9-10 : Xuất sắc   → Strong Yes
    - 7-8  : Tốt        → Yes
    - 5-6  : Trung bình → Maybe
    - 3-4  : Yếu        → No (cần thêm thời gian)
    - 0-2  : Không đạt  → No

    Trả về KẾT QUẢ CUỐI CÙNG theo định dạng JSON (chỉ JSON, không thêm text):
    {
      "total_score": {total_score},
      "grade": "<Xuất sắc|Tốt|Trung bình|Yếu|Không đạt>",
      "overall_feedback": "<Nhận xét tổng thể 3-4 câu>",
      "strengths": "<Điểm mạnh nổi bật nhất>",
      "weaknesses": "<Điểm yếu cần cải thiện ưu tiên nhất>",
      "category_scores": [
        {
          "category": "<tên loại>",
          "avg_score": <điểm trung bình>,
          "question_count": <số câu>,
          "assessment": "<nhận xét ngắn>"
        }
      ],
      "top_recommendations": [
        "<Lời khuyên 1>",
        "<Lời khuyên 2>",
        "<Lời khuyên 3>"
      ],
      "hiring_recommendation": "<Strong Yes|Yes|Maybe|No>",
      "hiring_reason": "<Lý do 2-3 câu>"
    }
  expected_output: >
    JSON hợp lệ chứa báo cáo tổng kết đầy đủ: total_score, grade,
    overall_feedback, strengths, weaknesses, category_scores,
    top_recommendations, hiring_recommendation, hiring_reason.
  agent: hiring_advisor
  context:
    - analyze_performance
