evaluate_answer:
  description: >
    Đánh giá câu trả lời phỏng vấn dưới đây:

    {cv_context}

    --- Câu hỏi ---
    {question_text}

    Loại câu hỏi: {category} | Độ khó: {difficulty}

    --- Gợi ý trả lời tham chiếu ---
    {hint_text}

    --- Câu trả lời của ứng viên ---
    {user_answer}
    ---

    Hãy đánh giá theo các tiêu chí:
    1. Tính chính xác và đầy đủ về nội dung kỹ thuật (nếu có)
    2. Cấu trúc và logic của câu trả lời
    3. Sự liên quan đến câu hỏi được đặt ra
    4. Chất lượng ví dụ và minh chứng (nếu có)

    Thang điểm 0.0 – 10.0:
    - 9-10: Xuất sắc, vượt kỳ vọng
    - 7-8:  Tốt, đáp ứng yêu cầu
    - 5-6:  Trung bình, còn thiếu sót
    - 3-4:  Yếu, thiếu nhiều điểm quan trọng
    - 0-2:  Không đạt hoặc không trả lời

    Trả về nhận xét chi tiết bao gồm điểm mạnh, điểm yếu và điểm số.
  expected_output: >
    Đánh giá chi tiết gồm: điểm số (0-10), điểm mạnh của câu trả lời,
    điểm còn yếu hoặc thiếu, nhận xét tổng thể.
  agent: answer_evaluator

coach_answer:
  description: >
    Dựa trên câu hỏi và đánh giá từ bước trước, hãy:

    1. Viết một câu trả lời MẪU tốt hơn cho câu hỏi sau:
    "{question_text}"

    2. Đưa ra 2-3 lời khuyên ngắn gọn, thực tế để ứng viên cải thiện
    kỹ năng trả lời loại câu hỏi {category} này.

    Câu trả lời mẫu phải:
    - Cụ thể, có cấu trúc rõ ràng
    - Phù hợp với độ khó: {difficulty}
    - Dùng framework STAR nếu là câu behavioral/situational

    Trả về KẾT QUẢ CUỐI CÙNG theo định dạng JSON (chỉ JSON, không thêm text):
    {
      "score": <điểm số từ đánh giá trước>,
      "comment": "<nhận xét tổng thể về câu trả lời>",
      "strengths": "<điểm mạnh>",
      "weaknesses": "<điểm còn thiếu hoặc chưa tốt>",
      "better_answer": "<câu trả lời mẫu tốt hơn>",
      "improvement_tips": "<lời khuyên cải thiện>"
    }
  expected_output: >
    JSON hợp lệ chứa score, comment, strengths, weaknesses,
    better_answer và improvement_tips.
  agent: answer_coach
  context:
    - evaluate_answer
