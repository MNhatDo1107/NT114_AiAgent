read_cv_task:
  description: >
    Đọc và phân tích CV sau đây, trích xuất thông tin kỹ thuật có cấu trúc:

    CV CONTENT:
    {cv_text}

    Hãy trích xuất và liệt kê rõ ràng:
    1. Technical skills: ngôn ngữ lập trình, frameworks, tools, cloud platforms
    2. Kinh nghiệm làm việc: vị trí, công ty, số năm kinh nghiệm
    3. Dự án nổi bật: tên, công nghệ sử dụng, vai trò
    4. Học vấn và chứng chỉ IT
    5. Điểm mạnh kỹ thuật tổng thể

    Nếu CV bị trống hoặc không rõ ràng, hãy ghi rõ "Không có thông tin".
  expected_output: >
    Bản phân tích CV có cấu trúc với 5 mục rõ ràng:
    technical_skills, work_experience, projects, education_certs, strengths

read_cv_task_agent: cv_reader_agent

analyze_position_task:
  description: >
    Phân tích yêu cầu cho vị trí IT sau:

    VỊ TRÍ: {position_title}
    KEY SKILLS YÊU CẦU: {position_key_skills}

    Hãy xác định rõ:
    1. Kỹ năng bắt buộc (must-have): không có thì không được nhận
    2. Kỹ năng ưu tiên (nice-to-have): có thì là lợi thế
    3. Mức kinh nghiệm phù hợp dựa trên tên vị trí
    4. Những gì nhà tuyển dụng thường kiểm tra khi phỏng vấn vị trí này
  expected_output: >
    Bản phân tích yêu cầu vị trí với must-have skills, nice-to-have skills,
    experience level và interview focus areas

analyze_position_task_agent: position_analyst_agent

improve_task:
  description: >
    Dựa trên kết quả phân tích CV và yêu cầu vị trí {position_title},
    hãy đưa ra đánh giá và gợi ý cải thiện CV.

    KEY SKILLS CỦA VỊ TRÍ: {position_key_skills}

    QUAN TRỌNG: Chỉ trả về JSON hợp lệ, không có text nào khác bên ngoài,
    không có markdown code block, không có giải thích thêm.

    JSON format bắt buộc:
    {{
      "overallScore": <số từ 0-100>,
      "summary": "<nhận xét tổng thể 2-3 câu bằng tiếng Việt>",
      "improvements": [
        {{
          "section": "<Summary|Skills|Experience|Projects|Education>",
          "issue": "<vấn đề hiện tại>",
          "suggestion": "<gợi ý cụ thể cần làm>",
          "priority": "<high|medium|low>"
        }}
      ],
      "missingSkills": ["<skill1>", "<skill2>"],
      "strongPoints": ["<điểm mạnh 1>", "<điểm mạnh 2>"],
      "quickWins": [
        "<việc làm ngay #1 để tăng điểm nhanh nhất>",
        "<việc làm ngay #2>",
        "<việc làm ngay #3>"
      ]
    }}

    Yêu cầu:
    - overallScore: đánh giá thực tế mức độ phù hợp CV với vị trí (0-100)
    - improvements: tối đa 5 gợi ý, tập trung vào impact cao nhất
    - missingSkills: chỉ liệt kê skills thực sự quan trọng còn thiếu
    - quickWins: đúng 3 việc, cụ thể và có thể làm được trong 1 tuần
    - Toàn bộ nội dung bằng tiếng Việt
  expected_output: >
    JSON hợp lệ với đầy đủ các trường: overallScore, summary,
    improvements, missingSkills, strongPoints, quickWins

improve_task_agent: improve_agent